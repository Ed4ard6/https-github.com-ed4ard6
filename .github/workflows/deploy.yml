name: Build & Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker images
        run: |
          docker build -t finance-backend:latest ./Backend
          docker build -t finance-frontend:latest ./Frontend

      - name: Push to Docker Hub (optional)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag finance-backend:latest ${{ secrets.DOCKER_USERNAME }}/finance-backend:latest
          docker tag finance-frontend:latest ${{ secrets.DOCKER_USERNAME }}/finance-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/finance-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/finance-frontend:latest

      - name: Deploy to Railway (configure manually)
        run: |
          echo "Deploy to Railway via dashboard:"
          echo "1. Go to railway.app"
          echo "2. Connect GitHub repo"
          echo "3. Deploy from Docker images"
